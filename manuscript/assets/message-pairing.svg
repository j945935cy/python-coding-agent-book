<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">ToolCall 與 ToolResult ID 配對</title><desc id="desc">AssistantMessage 產生 read 與 bash 兩個工具呼叫，各以唯一 ID 連到對應結果，完成順序不影響配對。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker></defs>
  <rect width="900" height="420" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="50" y="145" width="190" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="145" y="185" font-size="18" fill="#0f172a">AssistantMessage</text><text x="145" y="215" font-size="14" fill="#475569">tool_calls=[read, bash]</text>
    <rect x="330" y="55" width="210" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="435" y="90" font-size="18">ToolCall: read</text><text x="435" y="118" font-size="14">id = call-read</text>
    <rect x="330" y="275" width="210" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="435" y="310" font-size="18">ToolCall: bash</text><text x="435" y="338" font-size="14">id = call-test</text>
    <rect x="640" y="55" width="220" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="750" y="90" font-size="18">ToolResult: read</text><text x="750" y="118" font-size="14">tool_call_id = call-read</text>
    <rect x="640" y="275" width="220" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="750" y="310" font-size="18">ToolResult: bash</text><text x="750" y="338" font-size="14">tool_call_id = call-test</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"><path d="M240 170 C275 130 300 105 330 100"/><path d="M240 220 C275 265 300 305 330 315"/><path d="M540 100 L640 100"/><path d="M540 320 L640 320"/></g>
  <text x="590" y="202" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#475569">完成順序可以不同，配對 ID 不變</text>
</svg>
