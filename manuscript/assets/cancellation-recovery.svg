<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">取消、錯誤與恢復</title><desc id="desc">一般工具錯誤可回填模型；主動取消、最大回合與不可恢復協定錯誤走向安全停止。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker></defs>
<rect width="1100" height="460" fill="#fff"/><g font-family="sans-serif" text-anchor="middle" fill="#0f172a"><path d="M221.0 187.5 H246.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M432.0 187.5 H457.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M643.0 187.5 H668.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M854.0 187.5 H879.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5"/><text x="128.0" y="160" font-size="19" font-weight="700">工作進行</text><text x="128.0" y="190" font-size="13">模型／工具</text><text x="128.0" y="213" font-size="13">history</text><rect x="246.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="339.0" y="160" font-size="19" font-weight="700">安全邊界</text><text x="339.0" y="190" font-size="13">Token 檢查</text><text x="339.0" y="213" font-size="13">逾時</text><rect x="457.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#e11d48" stroke-width="2.5"/><text x="550.0" y="160" font-size="19" font-weight="700">錯誤分類</text><text x="550.0" y="190" font-size="13">工具錯誤</text><text x="550.0" y="213" font-size="13">取消／上限</text><rect x="668.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#ca8a04" stroke-width="2.5"/><text x="761.0" y="160" font-size="19" font-weight="700">處理</text><text x="761.0" y="190" font-size="13">回填模型</text><text x="761.0" y="213" font-size="13">或向外拋出</text><rect x="879.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5"/><text x="972.0" y="160" font-size="19" font-weight="700">收尾</text><text x="972.0" y="190" font-size="13">停止新工作</text><text x="972.0" y="213" font-size="13">清理行程</text>
<rect x="35" y="330" width="1030" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="550" y="372" font-size="15">可恢復不等於無限重試；max_turns 仍是必要邊界。</text></g></svg>