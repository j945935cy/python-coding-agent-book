<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">工具事件生命週期</title><desc id="desc">工具通過前置檢查後產生 tool_start，成功或失敗都在 finally 產生 tool_end，消費端以 call ID 配對。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker></defs>
<rect width="1100" height="460" fill="#fff"/><g font-family="sans-serif" text-anchor="middle" fill="#0f172a"><path d="M221.0 187.5 H246.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M432.0 187.5 H457.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M643.0 187.5 H668.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M854.0 187.5 H879.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5"/><text x="128.0" y="160" font-size="19" font-weight="700">模型決策</text><text x="128.0" y="190" font-size="13">ToolCall</text><text x="128.0" y="213" font-size="13">call ID</text><rect x="246.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="339.0" y="160" font-size="19" font-weight="700">前置檢查</text><text x="339.0" y="190" font-size="13">Validation</text><text x="339.0" y="213" font-size="13">Safety Hook</text><rect x="457.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#e11d48" stroke-width="2.5"/><text x="550.0" y="160" font-size="19" font-weight="700">tool_start</text><text x="550.0" y="190" font-size="13">事件開始</text><text x="550.0" y="213" font-size="13">記錄名稱</text><rect x="668.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#ca8a04" stroke-width="2.5"/><text x="761.0" y="160" font-size="19" font-weight="700">工具執行</text><text x="761.0" y="190" font-size="13">成功／錯誤</text><text x="761.0" y="213" font-size="13">逾時</text><rect x="879.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5"/><text x="972.0" y="160" font-size="19" font-weight="700">tool_end</text><text x="972.0" y="190" font-size="13">finally 收尾</text><text x="972.0" y="213" font-size="13">以 ID 配對</text>
<rect x="35" y="330" width="1030" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="550" y="372" font-size="15">狀態事件與模型文字增量是不同契約。</text></g></svg>