<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Workspace 邊界與檔案狀態</title><desc id="desc">模型提供的路徑先解析並確認實際位置仍位於 Workspace，之後 Read、Write、Edit 才能操作；目前也接受 Workspace 內的絕對路徑。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker></defs>
<rect width="1100" height="460" fill="#fff"/><g font-family="sans-serif" text-anchor="middle" fill="#0f172a"><path d="M221.0 187.5 H246.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M432.0 187.5 H457.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M643.0 187.5 H668.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M854.0 187.5 H879.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5"/><text x="128.0" y="160" font-size="19" font-weight="700">路徑輸入</text><text x="128.0" y="190" font-size="13">模型輸入</text><text x="128.0" y="213" font-size="13">不可信資料</text><rect x="246.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="339.0" y="160" font-size="19" font-weight="700">resolve</text><text x="339.0" y="190" font-size="13">正規化 ..</text><text x="339.0" y="213" font-size="13">解析連結</text><rect x="457.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#e11d48" stroke-width="2.5"/><text x="550.0" y="160" font-size="19" font-weight="700">relative_to</text><text x="550.0" y="190" font-size="13">確認位於</text><text x="550.0" y="213" font-size="13">Workspace</text><rect x="668.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#ca8a04" stroke-width="2.5"/><text x="761.0" y="160" font-size="19" font-weight="700">檔案工具</text><text x="761.0" y="190" font-size="13">Read／Write</text><text x="761.0" y="213" font-size="13">Edit</text><rect x="879.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5"/><text x="972.0" y="160" font-size="19" font-weight="700">驗證</text><text x="972.0" y="190" font-size="13">Read 回讀</text><text x="972.0" y="213" font-size="13">執行測試</text>
<rect x="35" y="330" width="1030" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="550" y="372" font-size="15">任何副作用都必須發生在 Workspace 驗證之後。</text></g></svg>