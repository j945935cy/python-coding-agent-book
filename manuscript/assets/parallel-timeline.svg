<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">循序與平行工具時間軸</title><desc id="desc">平行工具可能以不同順序完成，但 asyncio.gather 依輸入順序回傳結果；有資料相依的工具必須循序。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker></defs>
<rect width="1100" height="460" fill="#fff"/><g font-family="sans-serif" text-anchor="middle" fill="#0f172a"><path d="M221.0 187.5 H246.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M432.0 187.5 H457.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M643.0 187.5 H668.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M854.0 187.5 H879.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5"/><text x="128.0" y="160" font-size="19" font-weight="700">ToolCall A</text><text x="128.0" y="190" font-size="13">slow</text><text x="128.0" y="213" font-size="13">先提交</text><rect x="246.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/><text x="339.0" y="160" font-size="19" font-weight="700">ToolCall B</text><text x="339.0" y="190" font-size="13">fast</text><text x="339.0" y="213" font-size="13">後提交</text><rect x="457.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#e11d48" stroke-width="2.5"/><text x="550.0" y="160" font-size="19" font-weight="700">並行 await</text><text x="550.0" y="190" font-size="13">B 先完成</text><text x="550.0" y="213" font-size="13">A 後完成</text><rect x="668.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#ca8a04" stroke-width="2.5"/><text x="761.0" y="160" font-size="19" font-weight="700">gather 結果</text><text x="761.0" y="190" font-size="13">A 在前</text><text x="761.0" y="213" font-size="13">B 在後</text><rect x="879.0" y="125" width="186.0" height="125" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5"/><text x="972.0" y="160" font-size="19" font-weight="700">Context</text><text x="972.0" y="190" font-size="13">原呼叫順序</text><text x="972.0" y="213" font-size="13">ID 配對</text>
<rect x="35" y="330" width="1030" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="550" y="372" font-size="15">平行只適用於互不相依且不競爭同一資源的工作。</text></g></svg>