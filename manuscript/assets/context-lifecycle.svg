<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">Agent Context 生命週期</title>
  <desc id="desc">使用者訊息進入 Context，模型讀取後加入 assistant 訊息，工具結果再回到 Context，直到完成或停止。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker></defs>
  <rect width="940" height="500" fill="#fff"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="35" y="180" width="150" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="110" y="215" font-size="18">UserMessage</text><text x="110" y="238" font-size="13">任務起點</text>
    <rect x="245" y="135" width="200" height="170" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="345" y="170" font-size="20">AgentContext</text><text x="345" y="202" font-size="15">messages</text><text x="345" y="228" font-size="15">system_prompt</text><text x="345" y="254" font-size="15">metadata</text><text x="345" y="282" font-size="12" fill="#475569">只有 messages 自動序列化</text>
    <rect x="515" y="60" width="170" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="600" y="95" font-size="18">ModelClient</text><text x="600" y="118" font-size="13">讀取 payload</text>
    <rect x="745" y="60" width="160" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="825" y="95" font-size="18">AssistantMessage</text><text x="825" y="118" font-size="13">回答或 ToolCall</text>
    <rect x="745" y="330" width="160" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="825" y="365" font-size="18">ToolResult</text><text x="825" y="388" font-size="13">成功或錯誤</text>
    <rect x="515" y="330" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="600" y="365" font-size="18">Agent Loop</text><text x="600" y="388" font-size="13">唯一寫入協調者</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"><path d="M185 220 L245 220"/><path d="M445 165 C470 125 490 105 515 100"/><path d="M685 100 L745 100"/><path d="M825 140 L825 330"/><path d="M745 370 L685 370"/><path d="M515 370 C465 350 430 315 410 290"/></g>
  <path d="M745 115 C700 175 690 255 745 350" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="732" y="245" font-family="sans-serif" font-size="13" text-anchor="end" fill="#475569">無工具呼叫時完成</text>
  <text x="470" y="460" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#475569">完成、取消或保護性停止後，歷史交回呼叫端顯示與稽核</text>
</svg>
